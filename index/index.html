<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dulce Tentación</title>

        <link rel="stylesheet" href="style/normalize.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="style/style.css">
    </head>

    <body>

        <header class="header">
            <a href="index.html">
                <img class="header__logo"
                    src="img/dulcetentacion marron beige.png"
                    alt="Logotipo Dulce Tentación">
            </a>
        </header>

        <nav class="navegacion">
            <a class="navegacion__enlace navegacion__enlace--activo"
                href="index.html">
                Tienda
            </a>

            <a class="navegacion__enlace" href="nosotros.html">
                Nosotros
            </a>
        </nav>

        <main class="contenedor">

            <h1>Nuestros Productos</h1>

            <div class="grid">

                <div class="producto">
                    <a href="producto.html">
                        <img class="producto__imagen" src="img/tortarogel.webp"
                            alt="Torta Rogel">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Torta Rogel</p>
                            <p class="producto__precio">$1150</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="cheesecake.html">
                        <img class="producto__imagen" src="img/cheesecake.webp"
                            alt="Cheesecake">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Cheesecake frutos
                                rojos</p>
                            <p class="producto__precio">$1050</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="tartafrutal.html">
                        <img class="producto__imagen" src="img/tartafrutal.jpg"
                            alt="Torta Frutal">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Torta frutal</p>
                            <p class="producto__precio">$990</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="chaja.html">
                        <img class="producto__imagen" src="img/tortachaja.avif"
                            alt="Torta Chaja">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Torta Chaja</p>
                            <p class="producto__precio">$1100</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="redvelvet.html">
                        <img class="producto__imagen" src="img/redvelvet.avif"
                            alt="Red Velvet">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Red Velvet</p>
                            <p class="producto__precio">$1300</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="matilda.html">
                        <img class="producto__imagen" src="img/Tortamatilda.jpg"
                            alt="Torta Matilda">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Torta Matilda</p>
                            <p class="producto__precio">$1100</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="muffinsfrutosrojos.html">
                        <img class="producto__imagen"
                            src="img/muffinsfrutosrojos.jpg"
                            alt="Muffins frutos rojos">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Muffins frutos rojos</p>
                            <p class="producto__precio">$90</p>
                        </div>
                    </a>
                </div>

                <div class="producto">
                    <a href="muffinsddl.html">
                        <img class="producto__imagen" src="img/muffinsddl.avif"
                            alt="Muffins dulce de leche">

                        <div class="producto__informacion">
                            <p class="producto__nombre">Muffins dulce de
                                leche</p>
                            <p class="producto__precio">$85</p>
                        </div>
                    </a>
                </div>

            </div>

        </main>

        <footer class="footer">
            <p class="footer__texto">
                Dulce Tentación - Todos los derechos reservados 2026
            </p>
        </footer>

    </body>

</html>
